[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snort"
version = "0.1.0"
description = "Single-process live event ingestion with tamper-evident lineage (version 1: Lance store with DuckDB)"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=14",
  "duckdb>=0.9",
  "zstandard>=0.20",
  "blake3>=0.3",
  "pylance",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
snort = "snort.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
