name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: snort-macos-arm64
            python-version: "3.12"
          - os: windows-latest
            target: snort-windows-x64.exe
            python-version: "3.12"
          - os: ubuntu-latest
            target: snort-linux-x86_64
            python-version: "3.12"
          - os: ubuntu-24.04-arm
            target: snort-linux-arm64
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and packaging tools
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Binary
        shell: bash
        run: |
          python packaging/build_binary.py --output-name ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  build-android-executable:
    name: Build Binary (snort-android-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Android ARM64 Standalone Executable
        run: |
          python packaging/build_android.py --output-dir dist

      - name: Upload Android Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snort-android-arm64
          path: dist/snort-android-arm64
          if-no-files-found: error

  build-apk:
    name: Build Android Demo APK (snort-android-arm64.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          python packaging/build_apk.py --output-dir dist --output-name snort-android-arm64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snort-android-arm64.apk
          path: dist/snort-android-arm64.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Artifacts
    needs: [build-binaries, build-android-executable, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release_assets

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Consolidate and compute SHA256 checksums
        run: |
          find downloaded_artifacts -type f -exec cp {} release_assets/ \;
          cd release_assets
          chmod +x snort-* 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          echo "Release Assets:"
          ls -la
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
